# BREAK-AND-FIX #3 — apply this over the working core-app Deployment:
#   kubectl apply -f k8s/broken/core-app-bad-readiness-probe.yaml
# Expected symptom: pods show Running but never Ready — the readiness probe
# hits "/actuator/healthz", which doesn't exist (the real path is
# "/actuator/health/readiness"), so it 404s forever and the Service never
# routes traffic to these pods. Looks like a hung app; it isn't one.
# Diagnose with: kubectl describe pod <core-app-pod-name> (see the probe
# failure events) and kubectl logs <pod> (the app itself is running fine).
# Fix: reapply the real k8s/core-app-deployment.yaml (correct path).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: core-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: core-app
  template:
    metadata:
      labels:
        app: core-app
    spec:
      serviceAccountName: ticketing-ksa
      containers:
        - name: core-app
          image: europe-central2-docker.pkg.dev/ticketing-app-510211/ticketing/core-app:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: ticketing-config
          env:
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef: { name: ticketing-secrets, key: db-username }
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef: { name: ticketing-secrets, key: db-password }
            - name: SPRING_MONGODB_URI
              valueFrom:
                secretKeyRef: { name: ticketing-secrets, key: mongo-uri }
            - name: SPRING_RABBITMQ_HOST
              valueFrom:
                secretKeyRef: { name: ticketing-secrets, key: rabbitmq-host }
            - name: SPRING_RABBITMQ_PORT
              valueFrom:
                secretKeyRef: { name: ticketing-secrets, key: rabbitmq-port }
            - name: SPRING_RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef: { name: ticketing-secrets, key: rabbitmq-username }
            - name: SPRING_RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef: { name: ticketing-secrets, key: rabbitmq-password }
            - name: SPRING_RABBITMQ_VIRTUAL_HOST
              valueFrom:
                secretKeyRef: { name: ticketing-secrets, key: rabbitmq-vhost }
          resources:
            requests: { cpu: "500m", memory: "1Gi" }
            limits: { cpu: "1", memory: "1Gi" }
          readinessProbe:
            httpGet: { path: /actuator/healthz, port: 8080 }
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            initialDelaySeconds: 30
            periodSeconds: 15
        - name: cloud-sql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.26.0
          restartPolicy: Always
          startupProbe:
            httpGet: { path: /startup, port: 9090 }
            periodSeconds: 2
            failureThreshold: 30
          args:
            - "--structured-logs"
            - "--health-check"
            - "--http-address=0.0.0.0"
            - "--http-port=9090"
            - "--port=5432"
            - "ticketing-app-510211:europe-central2:ticketing-shared"
          resources:
            requests: { cpu: "250m", memory: "256Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
