name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build

  # Gated behind the `production` Environment's required reviewer, so this
  # is the one job that actually touches real infrastructure.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    # id-token: write is what lets this job mint the OIDC token Workload
    # Identity Federation exchanges for short-lived GCP credentials — easy
    # to forget, and nothing below works without it.
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Authenticate to Google Cloud via Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker europe-central2-docker.pkg.dev --quiet

      # bootBuildImage still produces the plain ticketing/<service>:latest
      # image it always has — local dev is unaffected. SHA tagging happens
      # one step down, not by touching build-logic's imageName at all.
      - name: Build images
        run: ./gradlew :core-app:bootBuildImage :payment-service:bootBuildImage :notification-service:bootBuildImage

      # By commit SHA, never `latest` — `latest` is never pushed to the
      # registry at all, only used as bootBuildImage's local output tag.
      - name: Tag and push images by commit SHA
        run: |
          for svc in core-app payment-service notification-service; do
            docker tag "ticketing/${svc}:latest" "${{ vars.ARTIFACT_REGISTRY }}/${svc}:${{ github.sha }}"
            docker push "${{ vars.ARTIFACT_REGISTRY }}/${svc}:${{ github.sha }}"
          done

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ vars.GKE_CLUSTER_NAME }}
          location: ${{ vars.GKE_CLUSTER_REGION }}

      - name: Deploy to GKE
        run: |
          kubectl set image deployment/core-app "core-app=${{ vars.ARTIFACT_REGISTRY }}/core-app:${{ github.sha }}"
          kubectl set image deployment/payment-service "payment-service=${{ vars.ARTIFACT_REGISTRY }}/payment-service:${{ github.sha }}"
          kubectl set image deployment/notification-service "notification-service=${{ vars.ARTIFACT_REGISTRY }}/notification-service:${{ github.sha }}"
          kubectl rollout status deployment/core-app
          kubectl rollout status deployment/payment-service
          kubectl rollout status deployment/notification-service
