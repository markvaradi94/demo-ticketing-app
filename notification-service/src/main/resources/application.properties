spring.application.name=notification-service
server.port=8082

management.tracing.sampling.probability=1.0

# Default is true — an unhandled exception would requeue and redeliver forever
# instead of dead-lettering. false is what actually routes a failing message to
# the DLQ (BookingEventsQueueConfig) via the created queue's
# x-dead-letter-exchange/-routing-key arguments.
spring.rabbitmq.listener.simple.default-requeue-rejected=false
