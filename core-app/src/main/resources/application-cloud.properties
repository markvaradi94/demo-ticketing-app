# Docker Compose auto-starting local Postgres/Mongo/RabbitMQ makes no sense once
# real cloud connection strings are in play — nothing to start, and no Docker
# daemon exists inside a Cloud Run container anyway.
spring.docker.compose.enabled=false

booking.max-seats-per-booking=6

# Which secrets GcpSecretsEnvironmentPostProcessor (in shared) fetches on this
# profile, and which Spring property each becomes. Every value below is a single,
# complete, ready-to-use connection string with credentials already embedded — the
# post-processor doesn't need to know anything about the shape of any one
# dependency's credentials, just the mapping.
gcp.secrets.mappings.cloud-sql-jdbc-url=spring.datasource.url
gcp.secrets.mappings.atlas-uri=spring.mongodb.uri
gcp.secrets.mappings.cloudamqp-uri=spring.rabbitmq.addresses

# cloud-sql-jdbc-url's secret value has the Cloud SQL Auth Proxy's own socket
# factory driver embedded in the JDBC URL itself
# (?cloudSqlInstance=...&socketFactory=com.google.cloud.sql.postgres.SocketFactory&user=...&password=...)
# — nothing else to configure here for Postgres connectivity specifically.

# payment-service and notification-service both need their own real URLs once
# deployed — these are placeholders to override per deployment (Cloud Run
# environment variables at deploy time), not secrets themselves.
payment-service.base-url=${PAYMENT_SERVICE_URL:http://localhost:8081}
