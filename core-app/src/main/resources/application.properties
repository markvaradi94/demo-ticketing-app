spring.application.name=ticketing
booking.max-seats-per-booking=8

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.generate_statistics=true
spring.sql.init.mode=always

# Relative to core-app's own directory, not the root — Gradle's bootRun task runs
# with the subproject's directory as its working directory, and the compose file
# stays at the repo root as shared infra (payment-service/notification-service
# connect to the same RabbitMQ without each independently trying to start it).
spring.docker.compose.file=../compose/docker-compose.yml

# 100%, not Boot's 10% default — a course demo needs every request traced, not a
# random sample.
management.tracing.sampling.probability=1.0

payment-service.base-url=http://localhost:8081
payment-service.connect-timeout=1s
# Shorter than payment-service's genuine 5s slow-path sleep, on purpose — this is
# what actually gives @Retry/@CircuitBreaker something real to react to. For the
# virtual-threads demo specifically, override this higher on the command line
# (--payment-service.read-timeout=10s) so the full 5s block is observed instead of
# cut short here.
payment-service.read-timeout=2s

# Small numbers so a live demo doesn't take minutes — Resilience4j's own defaults
# (sliding-window-size=100, minimum-number-of-calls=100) are sized for production
# traffic volume, not a classroom.
resilience4j.retry.instances.payment.max-attempts=2
resilience4j.retry.instances.payment.wait-duration=500ms
resilience4j.retry.instances.payment.ignore-exceptions=io.callisto.ticketing.booking.PaymentDeclinedException

resilience4j.circuitbreaker.instances.payment.sliding-window-size=4
resilience4j.circuitbreaker.instances.payment.minimum-number-of-calls=4
resilience4j.circuitbreaker.instances.payment.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.payment.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.payment.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.payment.ignore-exceptions=io.callisto.ticketing.booking.PaymentDeclinedException
